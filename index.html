    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
        :root {
            --primary: #0ea5e9;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }
        * { -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
            padding-left: var(--safe-left);
            padding-right: var(--safe-right);
            background-color: #020617;
        }
        .font-display { font-family: 'Space Grotesk', 'Inter', sans-serif; }
        .nav-item, .touch-btn { min-height: 44px; }
        .nav-item { transition: all 0.15s ease; }
        .nav-item:hover, .nav-item:active { background-color: rgba(14, 165, 233, 0.12); }
        .nav-item.active { background-color: #0ea5e9; color: white; }
        .card { transition: transform 0.15s ease, box-shadow 0.15s ease; }
        .status-badge { font-size: 0.7rem; letter-spacing: 0.02em; white-space: nowrap; }
        .modal-backdrop { background-color: rgba(2, 6, 23, 0.8); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
        input, select, textarea { font-size: 16px !important; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        .empty-state { border: 1px dashed #334155; }
        #sidebar { transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        #sidebar.mobile-closed { transform: translateX(-100%); }
        #sidebar-overlay { transition: opacity 0.25s ease; }
        .safe-bottom { padding-bottom: max(1rem, var(--safe-bottom)); }
        @media (max-width: 767px) {
            #content { padding: 1rem !important; }
            .card:active { transform: scale(0.98); }
        }
        .table-scroll { -webkit-overflow-scrolling: touch; }
        .sync-dot { width: 8px; height: 8px; border-radius: 50%; }
        .sync-dot.ok { background: #10b981; }
        .sync-dot.warn { background: #f59e0b; }
        .sync-dot.err { background: #f43f5e; }
        .sync-dot.off { background: #64748b; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200">

    <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 z-40 hidden md:hidden" onclick="closeMobileSidebar()"></div>

    <div id="app" class="flex h-full overflow-hidden">
        <aside id="sidebar" class="fixed md:relative z-50 w-72 md:w-64 h-full bg-slate-900 border-r border-slate-800 flex flex-col flex-shrink-0 mobile-closed md:translate-x-0">
            <div class="px-5 py-4 border-b border-slate-800 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-sky-500 rounded-xl flex items-center justify-center shadow-lg shadow-sky-500/20">
                        <i class="fa-solid fa-gears text-white text-lg"></i>
                    </div>
                    <div>
                        <div class="font-display text-base font-semibold tracking-tight leading-tight">Pro-Tack</div>
                        <div class="text-xs text-sky-400 font-medium">Hub</div>
                    </div>
                </div>
                <button onclick="closeMobileSidebar()" class="md:hidden w-10 h-10 flex items-center justify-center text-slate-400 hover:text-white rounded-lg">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
                <button onclick="showView('dashboard')" class="nav-item w-full flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-medium text-left" data-view="dashboard">
                    <i class="fa-solid fa-chart-pie w-5 text-center text-base"></i><span>Dashboard</span>
                </button>
                <button onclick="showView('projects')" class="nav-item w-full flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-medium text-left" data-view="projects">
                    <i class="fa-solid fa-industry w-5 text-center text-base"></i><span>Projects</span>
                </button>
                <button onclick="showView('goals')" class="nav-item w-full flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-medium text-left" data-view="goals">
                    <i class="fa-solid fa-bullseye w-5 text-center text-base"></i><span>Goals</span>
                </button>
                <button onclick="showView('milestones')" class="nav-item w-full flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-medium text-left" data-view="milestones">
                    <i class="fa-solid fa-flag-checkered w-5 text-center text-base"></i><span>Milestones</span>
                </button>
                <button onclick="showView('ideas')" class="nav-item w-full flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-medium text-left" data-view="ideas">
                    <i class="fa-solid fa-lightbulb w-5 text-center text-base"></i><span>Ideas</span>
                </button>
                <button onclick="showView('changes')" class="nav-item w-full flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-medium text-left" data-view="changes">
                    <i class="fa-solid fa-code-branch w-5 text-center text-base"></i><span>Change Log</span>
                </button>
            </nav>

            <div class="p-3 border-t border-slate-800 safe-bottom space-y-1">
                <div class="flex items-center gap-2 px-3 py-1.5 text-xs text-slate-500">
                    <span id="sync-status-dot" class="sync-dot off"></span>
                    <span id="sync-status-text">Local only</span>
                </div>
                <button onclick="showView('settings')" class="nav-item w-full flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-medium text-left" data-view="settings">
                    <i class="fa-solid fa-gear w-5 text-center text-base"></i><span>Settings & Sync</span>
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden w-full">
            <header class="bg-slate-900 border-b border-slate-800 px-4 md:px-6 py-3 md:py-4 flex items-center justify-between flex-shrink-0 gap-3">
                <div class="flex items-center gap-3 min-w-0">
                    <button onclick="openMobileSidebar()" class="md:hidden w-11 h-11 flex items-center justify-center -ml-1 text-slate-300 hover:text-white rounded-xl active:bg-slate-800">
                        <i class="fa-solid fa-bars text-lg"></i>
                    </button>
                    <div class="min-w-0">
                        <h1 id="view-title" class="font-display text-lg md:text-xl font-semibold tracking-tight truncate">Dashboard</h1>
                        <p id="view-subtitle" class="text-xs md:text-sm text-slate-400 mt-0.5 truncate hidden sm:block">Overview of development activity</p>
                    </div>
                </div>
                <div class="flex items-center gap-2 flex-shrink-0">
                    <button id="header-action-btn" onclick="handleHeaderAction()" class="hidden touch-btn px-3 md:px-4 py-2.5 bg-sky-500 active:bg-sky-400 text-white text-sm font-medium rounded-xl transition-colors">
                        <i class="fa-solid fa-plus md:mr-2"></i><span id="header-action-label" class="hidden md:inline">New</span>
                    </button>
                </div>
            </header>
            <div id="content" class="flex-1 overflow-y-auto p-4 md:p-6 overscroll-contain"></div>
        </main>
    </div>

    <div id="modal" class="fixed inset-0 z-[60] hidden items-end md:items-center justify-center modal-backdrop">
        <div class="bg-slate-900 border border-slate-700 md:rounded-2xl rounded-t-2xl shadow-2xl w-full md:max-w-lg md:mx-4 max-h-[92vh] md:max-h-[90vh] overflow-y-auto safe-bottom">
            <div class="px-5 py-4 border-b border-slate-800 flex items-center justify-between sticky top-0 bg-slate-900 z-10">
                <h2 id="modal-title" class="font-display text-lg font-semibold">Modal</h2>
                <button onclick="closeModal()" class="w-11 h-11 -mr-2 flex items-center justify-center text-slate-400 active:text-white rounded-xl">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div id="modal-body" class="p-5"></div>
        </div>
    </div>

    <div id="toast" class="fixed left-4 right-4 md:left-auto md:right-6 bottom-6 z-[70] hidden safe-bottom">
        <div class="bg-slate-800 border border-slate-700 text-slate-100 px-5 py-3.5 rounded-xl shadow-xl flex items-center gap-3 max-w-md mx-auto md:mx-0">
            <i id="toast-icon" class="fa-solid fa-check-circle text-emerald-400"></i>
            <span id="toast-message" class="text-sm">Saved</span>
        </div>
    </div>

<script>
// ============================================================
// CONFIG & STORAGE
// ============================================================
const STORAGE_KEY = 'protack_hub_v1';
const TOKEN_KEY = 'protack_gh_token';
const OWNER = 'cotycoots-tech';
const REPO = 'bb-development-hub';
const DATA_PATH = 'data.json';
const BRANCH = 'main';

const DEFAULT_DATA = {
    projects: [], goals: [], milestones: [], ideas: [], changes: [],
    meta: { version: 1, lastUpdated: null, lastSynced: null }
};

let data = loadLocal();
let githubToken = localStorage.getItem(TOKEN_KEY) || '';
let dataSha = null;          // current blob SHA of data.json
let syncState = 'off';       // off | ok | warn | err
let isSyncing = false;

function loadLocal() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return { ...DEFAULT_DATA, ...JSON.parse(raw) };
    } catch (e) { console.error(e); }
    return structuredClone(DEFAULT_DATA);
}

function saveLocal() {
    data.meta.lastUpdated = new Date().toISOString();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function generateId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// ============================================================
// GITHUB SYNC
// ============================================================
async function githubFetch(path, options = {}) {
    if (!githubToken) throw new Error('No token');
    const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`;
    const res = await fetch(url, {
        ...options,
        headers: {
            'Accept': 'application/vnd.github+json',
            'Authorization': `Bearer ${githubToken}`,
            'X-GitHub-Api-Version': '2022-11-28',
            ...(options.headers || {})
        }
    });
    if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || `GitHub ${res.status}`);
    }
    return res;
}

async function pullFromGitHub() {
    if (!githubToken) return false;
    try {
        const res = await githubFetch(`${DATA_PATH}?ref=${BRANCH}`);
        const json = await res.json();
        dataSha = json.sha;
        const content = JSON.parse(atob(json.content.replace(/\n/g, '')));
        data = { ...DEFAULT_DATA, ...content };
        data.meta.lastSynced = new Date().toISOString();
        saveLocal();
        setSyncState('ok');
        return true;
    } catch (e) {
        if (e.message && e.message.includes('404')) {
            // file does not exist yet – push current local data
            await pushToGitHub('Initialize Pro-Tack Hub data');
            return true;
        }
        console.error('Pull failed', e);
        setSyncState('err');
        showToast(e.message || 'Pull failed', true);
        return false;
    }
}

async function pushToGitHub(message = 'Update Pro-Tack Hub data') {
    if (!githubToken || isSyncing) return false;
    isSyncing = true;
    setSyncState('warn');
    try {
        const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
        const body = {
            message,
            content,
            branch: BRANCH
        };
        if (dataSha) body.sha = dataSha;

        const res = await githubFetch(DATA_PATH, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const json = await res.json();
        dataSha = json.content.sha;
        data.meta.lastSynced = new Date().toISOString();
        saveLocal();
        setSyncState('ok');
        showToast('Synced to GitHub');
        return true;
    } catch (e) {
        console.error('Push failed', e);
        setSyncState('err');
        showToast(e.message || 'Sync failed', true);
        return false;
    } finally {
        isSyncing = false;
    }
}

async function saveAndSync() {
    saveLocal();
    if (githubToken) {
        // debounce-ish: small delay then push
        clearTimeout(window._syncTimer);
        window._syncTimer = setTimeout(() => pushToGitHub(), 800);
    }
}

function setSyncState(state) {
    syncState = state;
    const dot = document.getElementById('sync-status-dot');
    const txt = document.getElementById('sync-status-text');
    if (!dot || !txt) return;
    dot.className = 'sync-dot ' + state;
    const labels = { off: 'Local only', ok: 'Synced', warn: 'Syncing…', err: 'Sync error' };
    txt.textContent = labels[state] || 'Local only';
}

function saveToken(token) {
    githubToken = (token || '').trim();
    if (githubToken) localStorage.setItem(TOKEN_KEY, githubToken);
    else localStorage.removeItem(TOKEN_KEY);
}

// ============================================================
// STATUS OPTIONS
// ============================================================
const PROJECT_TYPES = ['New Development', 'Existing Machine Modification'];
const PROJECT_STATUSES = ['Planning', 'In Progress', 'On Hold', 'Completed', 'Cancelled'];
const GOAL_STATUSES = ['Not Started', 'In Progress', 'Achieved', 'Abandoned'];
const GOAL_PRIORITIES = ['Low', 'Medium', 'High', 'Critical'];
const MILESTONE_STATUSES = ['Pending', 'In Progress', 'Completed', 'Missed'];
const IDEA_STATUSES = ['New', 'Exploring', 'Implemented', 'Discarded'];

const STATUS_COLORS = {
    'Planning': 'bg-slate-600 text-slate-200', 'Not Started': 'bg-slate-600 text-slate-200',
    'In Progress': 'bg-sky-600 text-white', 'On Hold': 'bg-amber-600 text-white',
    'Completed': 'bg-emerald-600 text-white', 'Achieved': 'bg-emerald-600 text-white',
    'Cancelled': 'bg-rose-600 text-white', 'Abandoned': 'bg-rose-600 text-white',
    'Pending': 'bg-slate-600 text-slate-200', 'Missed': 'bg-rose-700 text-white',
    'New': 'bg-indigo-600 text-white', 'Exploring': 'bg-violet-600 text-white',
    'Implemented': 'bg-emerald-600 text-white', 'Discarded': 'bg-slate-700 text-slate-300',
    'Low': 'bg-slate-600 text-slate-200', 'Medium': 'bg-blue-600 text-white',
    'High': 'bg-orange-600 text-white', 'Critical': 'bg-rose-600 text-white'
};

function statusBadge(status) {
    const color = STATUS_COLORS[status] || 'bg-slate-600 text-slate-200';
    return `<span class="status-badge inline-flex items-center px-2 py-0.5 rounded-md font-medium ${color}">${status}</span>`;
}
function formatDate(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}
function formatDateTime(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleString('en-US', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

// ============================================================
// MOBILE + VIEWS
// ============================================================
function openMobileSidebar() {
    document.getElementById('sidebar').classList.remove('mobile-closed');
    document.getElementById('sidebar-overlay').classList.remove('hidden');
    document.body.style.overflow = 'hidden';
}
function closeMobileSidebar() {
    document.getElementById('sidebar').classList.add('mobile-closed');
    document.getElementById('sidebar-overlay').classList.add('hidden');
    document.body.style.overflow = '';
}

let currentView = 'dashboard';

function showView(view) {
    currentView = view;
    closeMobileSidebar();
    document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.view === view));
    const titles = {
        dashboard: ['Dashboard', 'Overview of development activity'],
        projects: ['Projects', 'Machines and development efforts'],
        goals: ['Goals', 'Targeted outcomes for testing phases'],
        milestones: ['Milestones', 'Key checkpoints toward goals'],
        ideas: ['Ideas', 'Captured development concepts'],
        changes: ['Change Log', 'Recorded modifications and results'],
        settings: ['Settings & Sync', 'Token, sync, and data management']
    };
    document.getElementById('view-title').textContent = titles[view][0];
    document.getElementById('view-subtitle').textContent = titles[view][1];
    const actionBtn = document.getElementById('header-action-btn');
    const actionLabel = document.getElementById('header-action-label');
    if (['projects', 'goals', 'milestones', 'ideas', 'changes'].includes(view)) {
        actionBtn.classList.remove('hidden');
        const labels = { projects: 'New Project', goals: 'New Goal', milestones: 'New Milestone', ideas: 'New Idea', changes: 'New Change' };
        actionLabel.textContent = labels[view];
    } else actionBtn.classList.add('hidden');
    renderView();
}

function handleHeaderAction() {
    if (currentView === 'projects') openProjectModal();
    else if (currentView === 'goals') openGoalModal();
    else if (currentView === 'milestones') openMilestoneModal();
    else if (currentView === 'ideas') openIdeaModal();
    else if (currentView === 'changes') openChangeModal();
}

function renderView() {
    const content = document.getElementById('content');
    switch (currentView) {
        case 'dashboard': content.innerHTML = renderDashboard(); break;
        case 'projects': content.innerHTML = renderProjects(); break;
        case 'goals': content.innerHTML = renderGoals(); break;
        case 'milestones': content.innerHTML = renderMilestones(); break;
        case 'ideas': content.innerHTML = renderIdeas(); break;
        case 'changes': content.innerHTML = renderChanges(); break;
        case 'settings': content.innerHTML = renderSettings(); break;
    }
}

// ============================================================
// DASHBOARD (same structure as before)
// ============================================================
function renderDashboard() {
    const activeProjects = data.projects.filter(p => ['Planning', 'In Progress', 'On Hold'].includes(p.status));
    const activeGoals = data.goals.filter(g => ['Not Started', 'In Progress'].includes(g.status));
    const upcomingMilestones = data.milestones.filter(m => m.status !== 'Completed').sort((a, b) => (a.targetDate || '').localeCompare(b.targetDate || '')).slice(0, 5);
    const recentChanges = [...data.changes].sort((a, b) => (b.date || b.createdAt || '').localeCompare(a.date || a.createdAt || '')).slice(0, 6);
    const openIdeas = data.ideas.filter(i => ['New', 'Exploring'].includes(i.status));

    return `
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4 mb-6 md:mb-8">
            <div class="card bg-slate-900 border border-slate-800 rounded-xl p-4 md:p-5">
                <div class="flex items-center justify-between"><div><p class="text-xs md:text-sm text-slate-400">Active Projects</p><p class="text-2xl md:text-3xl font-semibold mt-1">${activeProjects.length}</p></div>
                <div class="w-10 h-10 md:w-11 md:h-11 rounded-xl bg-sky-500/10 flex items-center justify-center"><i class="fa-solid fa-industry text-sky-400"></i></div></div>
            </div>
            <div class="card bg-slate-900 border border-slate-800 rounded-xl p-4 md:p-5">
                <div class="flex items-center justify-between"><div><p class="text-xs md:text-sm text-slate-400">Active Goals</p><p class="text-2xl md:text-3xl font-semibold mt-1">${activeGoals.length}</p></div>
                <div class="w-10 h-10 md:w-11 md:h-11 rounded-xl bg-emerald-500/10 flex items-center justify-center"><i class="fa-solid fa-bullseye text-emerald-400"></i></div></div>
            </div>
            <div class="card bg-slate-900 border border-slate-800 rounded-xl p-4 md:p-5">
                <div class="flex items-center justify-between"><div><p class="text-xs md:text-sm text-slate-400">Open Ideas</p><p class="text-2xl md:text-3xl font-semibold mt-1">${openIdeas.length}</p></div>
                <div class="w-10 h-10 md:w-11 md:h-11 rounded-xl bg-violet-500/10 flex items-center justify-center"><i class="fa-solid fa-lightbulb text-violet-400"></i></div></div>
            </div>
            <div class="card bg-slate-900 border border-slate-800 rounded-xl p-4 md:p-5">
                <div class="flex items-center justify-between"><div><p class="text-xs md:text-sm text-slate-400">Total Changes</p><p class="text-2xl md:text-3xl font-semibold mt-1">${data.changes.length}</p></div>
                <div class="w-10 h-10 md:w-11 md:h-11 rounded-xl bg-amber-500/10 flex items-center justify-center"><i class="fa-solid fa-code-branch text-amber-400"></i></div></div>
            </div>
        </div>
        <div class="grid grid-cols-1 xl:grid-cols-2 gap-4 md:gap-6">
            <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
                <div class="px-4 md:px-5 py-3.5 border-b border-slate-800 flex items-center justify-between">
                    <h3 class="font-display font-semibold text-sm md:text-base">Upcoming Milestones</h3>
                    <button onclick="showView('milestones')" class="text-xs text-sky-400 active:text-sky-300 py-1 px-2">View all</button>
                </div>
                <div class="divide-y divide-slate-800">
                    ${upcomingMilestones.length === 0 ? `<div class="p-6 text-center text-slate-500 text-sm">No upcoming milestones</div>` :
                    upcomingMilestones.map(m => {
                        const goal = data.goals.find(g => g.id === m.goalId);
                        return `<div class="px-4 md:px-5 py-3.5 flex items-start justify-between gap-3 active:bg-slate-800/40">
                            <div class="min-w-0"><div class="font-medium text-sm truncate">${escapeHtml(m.title)}</div>
                            <div class="text-xs text-slate-400 mt-0.5 truncate">${goal ? escapeHtml(goal.title) : 'No goal linked'}</div></div>
                            <div class="flex flex-col items-end gap-1 flex-shrink-0">${statusBadge(m.status)}<span class="text-xs text-slate-400">${formatDate(m.targetDate)}</span></div>
                        </div>`;
                    }).join('')}
                </div>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
                <div class="px-4 md:px-5 py-3.5 border-b border-slate-800 flex items-center justify-between">
                    <h3 class="font-display font-semibold text-sm md:text-base">Recent Changes</h3>
                    <button onclick="showView('changes')" class="text-xs text-sky-400 active:text-sky-300 py-1 px-2">View all</button>
                </div>
                <div class="divide-y divide-slate-800">
                    ${recentChanges.length === 0 ? `<div class="p-6 text-center text-slate-500 text-sm">No changes recorded yet</div>` :
                    recentChanges.map(c => {
                        const project = data.projects.find(p => p.id === c.projectId);
                        return `<div class="px-4 md:px-5 py-3.5 active:bg-slate-800/40">
                            <div class="font-medium text-sm truncate">${escapeHtml(c.summary)}</div>
                            <div class="text-xs text-slate-400 mt-0.5">${project ? escapeHtml(project.name) : 'No project'} · ${formatDate(c.date || c.createdAt)}</div>
                        </div>`;
                    }).join('')}
                </div>
            </div>
        </div>
        <div class="mt-4 md:mt-6 bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
            <div class="px-4 md:px-5 py-3.5 border-b border-slate-800 flex items-center justify-between">
                <h3 class="font-display font-semibold text-sm md:text-base">Active Projects</h3>
                <button onclick="showView('projects')" class="text-xs text-sky-400 active:text-sky-300 py-1 px-2">View all</button>
            </div>
            <div class="table-scroll overflow-x-auto">
                <table class="w-full text-sm min-w-[480px]">
                    <thead><tr class="text-left text-slate-400 border-b border-slate-800">
                        <th class="px-4 md:px-5 py-3 font-medium">Name</th><th class="px-4 md:px-5 py-3 font-medium">Type</th>
                        <th class="px-4 md:px-5 py-3 font-medium">Status</th><th class="px-4 md:px-5 py-3 font-medium">Goals</th>
                        <th class="px-4 md:px-5 py-3 font-medium">Start</th>
                    </tr></thead>
                    <tbody class="divide-y divide-slate-800">
                        ${activeProjects.length === 0 ? `<tr><td colspan="5" class="px-5 py-8 text-center text-slate-500">No active projects</td></tr>` :
                        activeProjects.map(p => {
                            const goalCount = data.goals.filter(g => g.projectId === p.id).length;
                            return `<tr class="active:bg-slate-800/40">
                                <td class="px-4 md:px-5 py-3 font-medium">${escapeHtml(p.name)}</td>
                                <td class="px-4 md:px-5 py-3 text-slate-400 text-xs md:text-sm">${escapeHtml(p.type)}</td>
                                <td class="px-4 md:px-5 py-3">${statusBadge(p.status)}</td>
                                <td class="px-4 md:px-5 py-3">${goalCount}</td>
                                <td class="px-4 md:px-5 py-3 text-slate-400">${formatDate(p.startDate)}</td>
                            </tr>`;
                        }).join('')}
                    </tbody>
                </table>
            </div>
        </div>`;
}

// ============================================================
// PROJECTS / GOALS / MILESTONES / IDEAS / CHANGES
// (CRUD helpers – condensed but complete)
// ============================================================
function emptyState(title, subtitle, btnLabel, onclick) {
    return `<div class="empty-state rounded-2xl p-8 md:p-12 text-center max-w-md mx-auto mt-8 md:mt-12">
        <div class="w-14 h-14 bg-slate-800 rounded-2xl flex items-center justify-center mx-auto mb-4"><i class="fa-solid fa-inbox text-slate-500 text-xl"></i></div>
        <h3 class="font-display font-semibold text-lg">${title}</h3>
        <p class="text-sm text-slate-400 mt-2">${subtitle}</p>
        <button onclick="${onclick}" class="touch-btn mt-6 px-5 py-3 bg-sky-500 active:bg-sky-400 text-white text-sm font-medium rounded-xl">
            <i class="fa-solid fa-plus mr-2"></i>${btnLabel}
        </button></div>`;
}

function renderProjects() {
    if (data.projects.length === 0) return emptyState('No projects yet', 'Create a project to begin tracking development goals and changes.', 'New Project', 'openProjectModal()');
    return `<div class="grid grid-cols-1 lg:grid-cols-2 gap-3 md:gap-4">${data.projects.map(p => {
        const goals = data.goals.filter(g => g.projectId === p.id);
        const changes = data.changes.filter(c => c.projectId === p.id);
        return `<div class="card bg-slate-900 border border-slate-800 rounded-xl p-4 md:p-5">
            <div class="flex items-start justify-between gap-3"><div class="min-w-0"><h3 class="font-display font-semibold text-base md:text-lg truncate">${escapeHtml(p.name)}</h3>
            <p class="text-xs text-slate-400 mt-1">${escapeHtml(p.type)}</p></div>${statusBadge(p.status)}</div>
            ${p.description ? `<p class="text-sm text-slate-400 mt-3 line-clamp-2">${escapeHtml(p.description)}</p>` : ''}
            <div class="flex flex-wrap items-center gap-x-4 gap-y-1 mt-3 text-xs text-slate-500">
                <span><i class="fa-solid fa-bullseye mr-1.5"></i>${goals.length} goals</span>
                <span><i class="fa-solid fa-code-branch mr-1.5"></i>${changes.length} changes</span>
                <span><i class="fa-solid fa-calendar mr-1.5"></i>${formatDate(p.startDate)}</span>
            </div>
            <div class="flex gap-2 mt-4 pt-3 border-t border-slate-800">
                <button onclick="openProjectModal('${p.id}')" class="touch-btn text-xs px-4 py-2 bg-slate-800 active:bg-slate-700 rounded-lg">Edit</button>
                <button onclick="deleteProject('${p.id}')" class="touch-btn text-xs px-4 py-2 text-rose-400 active:bg-rose-500/10 rounded-lg">Delete</button>
            </div></div>`;
    }).join('')}</div>`;
}

function openProjectModal(id = null) {
    const project = id ? data.projects.find(p => p.id === id) : null;
    const isEdit = !!project;
    document.getElementById('modal-title').textContent = isEdit ? 'Edit Project' : 'New Project';
    document.getElementById('modal-body').innerHTML = `
        <form onsubmit="saveProject(event, '${id || ''}')" class="space-y-4">
            <div><label class="block text-sm font-medium text-slate-300 mb-1.5">Name *</label>
            <input name="name" required value="${escapeAttr(project?.name || '')}" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-3 focus:outline-none focus:border-sky-500" placeholder="e.g. Tie Plate Gripper V2"></div>
            <div><label class="block text-sm font-medium text-slate-300 mb-1.5">Type *</label>
            <select name="type" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-3 focus:outline-none focus:border-sky-500">
                ${PROJECT_TYPES.map(t => `<option value="${t}" ${project?.type === t ? 'selected' : ''}>${t}</option>`).join('')}
            </select></div>
            <div><label class="block text-sm font-medium text-slate-300 mb-1.5">Status</label>
            <select name="status" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-3 focus:outline-none focus:border-sky-500">
                ${PROJECT_STATUSES.map(s => `<option value="${s}" ${project?.status === s ? 'selected' : ''}>${s}</option>`).join('')}
            </select></div>
            <div><label class="block text-sm font-medium text-slate-300 mb-1.5">Start Date</label>
            <input name="startDate" type="date" value="${project?.startDate || ''}" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-3 focus:outline-none focus:border-sky-500"></div>
            <div><label class="block text-sm font-medium text-slate-300 mb-1.5">Description</label>
            <textarea name="description" rows="3" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-3 focus:outline-none focus:border-sky-500" placeholder="Brief description...">${escapeHtml(project?.description || '')}</textarea></div>
            <div class="flex flex-col-reverse sm:flex-row justify-end gap-3 pt-2">
                <button type="button" onclick="closeModal()" class="touch-btn px-4 py-3 text-sm text-slate-400 active:text-white rounded-xl">Cancel</button>
                <button type="submit" class="touch-btn px-4 py-3 bg-sky-500 active:bg-sky-400 text-white text-sm font-medium rounded-xl">${isEdit ? 'Save Changes' : 'Create Project'}</button>
            </div>
        </form>`;
    openModal();
}

function saveProject(e, id) {
    e.preventDefault();
    const form = e.target;
    const now = new Date().toISOString();
    if (id) {
        const idx = data.projects.findIndex(p => p.id === id);
        if (idx >= 0) data.projects[idx] = { ...data.projects[idx], name: form.name.value.trim(), type: form.type.value, status: form.status.value, startDate: form.startDate.value || null, description: form.description.value.trim(), updatedAt: now };
    } else {
        data.projects.push({ id: generateId(), name: form.name.value.trim(), type: form.type.value, status: form.status.value, startDate: form.startDate.value || null, description: form.description.value.trim(), createdAt: now, updatedAt: now });
    }
    saveAndSync(); closeModal(); showToast(id ? 'Project updated' : 'Project created'); renderView();
}

function deleteProject(id) {
    if (!confirm('Delete this project? Linked items will remain but lose the project link.')) return;
    data.projects = data.projects.filter(p => p.id !== id);
    saveAndSync(); showToast('Project deleted'); renderView();
}

// Goals
function renderGoals() {
    if (data.goals.length === 0) return emptyState('No goals yet', 'Define goals to track testing phase outcomes.', 'New Goal', 'openGoalModal()');
    return `<div class="space-y-3">${data.goals.map(g => {
        const project = data.projects.find(p => p.id === g.projectId);
        const milestones = data.milestones.filter(m => m.goalId === g.id);
        const completedMs = milestones.filter(m => m.status === 'Completed').length;
        return `<div class="card bg-slate-900 border border-slate-800 rounded-xl p-4 md:p-5">
            <div class="flex items-start justify-between gap-3"><div class="min-w-0 flex-1">
                <div class="flex items-center gap-2 flex-wrap"><h3 class="font-display font-semibold text-base">${escapeHtml(g.title)}</h3>${statusBadge(g.status)}${g.priority ? statusBadge(g.priority) : ''}</div>
                <p class="text-xs text-slate-400 mt-1.5">${project ? escapeHtml(project.name) : 'No project'} · Target: ${formatDate(g.targetDate)}</p>

                    <input id="token-input" type="password" value="${escapeAttr(githubToken)}" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-3 focus:outline-none focus:border-sky-500">
                    <div class="flex flex-wrap gap-2">
                        <button onclick="saveTokenFromInput()" class="touch-btn px-4 py-2.5 bg-sky-500 active:bg-sky-400 text-white text-sm font-medium rounded-xl">Save Token</button>
                        <button onclick="pullFromGitHub().then(() => { renderView(); showToast('Pulled from GitHub'); })" class="touch-btn px-4 py-2.5 bg-slate-700 active:bg-slate-600 text-white text-sm font-medium rounded-xl" ${hasToken ? '' : 'disabled'}>Pull</button>
                        <button onclick="pushToGitHub()" class="touch-btn px-4 py-2.5 bg-slate-700 active:bg-slate-600 text-white text-sm font-medium rounded-xl" ${hasToken ? '' : 'disabled'}>Push</button>
                        <button onclick="clearToken()" class="touch-btn px-4 py-2.5 text-rose-400 active:bg-rose-500/10 text-sm font-medium rounded-xl">Clear Token</button>
                    </div>
                    <p class="text-xs text-slate-500">Status: <span class="text-slate-300">${hasToken ? 'Token saved (local only)' : 'No token'}</span> · Last synced: ${lastSynced}</p>
                </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 md:p-6">
                <h3 class="font-display font-semibold mb-4">Data Summary</h3>
                <div class="grid grid-cols-3 sm:grid-cols-5 gap-3 text-center">
                    <div><div class="text-xl md:text-2xl font-semibold">${counts.projects}</div><div class="text-xs text-slate-400 mt-1">Projects</div></div>
                    <div><div class="text-xl md:text-2xl font-semibold">${counts.goals}</div><div class="text-xs text-slate-400 mt-1">Goals</div></div>
                    <div><div class="text-xl md:text-2xl font-semibold">${counts.milestones}</div><div class="text-xs text-slate-400 mt-1">Milestones</div></div>
                    <div><div class="text-xl md:text-2xl font-semibold">${counts.ideas}</div><div class="text-xs text-slate-400 mt-1">Ideas</div></div>
                    <div><div class="text-xl md:text-2xl font-semibold">${counts.changes}</div><div class="text-xs text-slate-400 mt-1">Changes</div></div>
                </div>
                <p class="text-xs text-slate-500 mt-4">Last local save: ${lastUpdated}</p>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 md:p-6">
                <h3 class="font-display font-semibold mb-2">Export / Import</h3>
                <p class="text-sm text-slate-400 mb-4">Manual backup or transfer between devices.</p>
                <div class="flex flex-wrap gap-2">
                    <button onclick="exportData()" class="touch-btn px-4 py-2.5 bg-sky-500 active:bg-sky-400 text-white text-sm font-medium rounded-xl"><i class="fa-solid fa-download mr-2"></i>Export JSON</button>
                    <label class="touch-btn px-4 py-2.5 bg-slate-700 active:bg-slate-600 text-white text-sm font-medium rounded-xl cursor-pointer">
                        <i class="fa-solid fa-upload mr-2"></i>Import
                        <input type="file" accept=".json,application/json" class="hidden" onchange="importData(event)">
                    </label>
                </div>
            </div>

            <div class="bg-slate-900 border border-rose-900/50 rounded-xl p-5 md:p-6">
                <h3 class="font-display font-semibold mb-2 text-rose-400">Danger Zone</h3>
                <p class="text-sm text-slate-400 mb-4">Permanently delete all local data. Remote data.json is not deleted.</p>
                <button onclick="clearAllData()" class="touch-btn px-4 py-2.5 bg-rose-600/20 active:bg-rose-600/30 text-rose-400 text-sm font-medium rounded-xl border border-rose-800">Clear Local Data</button>
            </div>
        </div>`;
}

function saveTokenFromInput() {
    const val = document.getElementById('token-input').value.trim();
    saveToken(val);
    setSyncState(val ? 'warn' : 'off');
    showToast(val ? 'Token saved' : 'Token cleared');
    if (val) pullFromGitHub().then(() => renderView());
    else renderView();
}

function clearToken() {
    saveToken('');
    dataSha = null;
    setSyncState('off');
    showToast('Token cleared');
    renderView();
}

function exportData() {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `protack-hub-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Export downloaded');
}

function importData(ev) {
    const file = ev.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const imported = JSON.parse(e.target.result);
            if (!imported.projects || !imported.goals) throw new Error('Invalid format');
            if (!confirm('Replace all current data with this file?')) return;
            data = { ...DEFAULT_DATA, ...imported };
            saveAndSync();
            showToast('Data imported');
            renderView();
        } catch (err) { showToast('Invalid JSON file', true); }
    };
    reader.readAsText(file);
}

function clearAllData() {
    if (!confirm('Delete ALL local data? This cannot be undone.')) return;
    if (!confirm('Are you absolutely sure?')) return;
    data = structuredClone(DEFAULT_DATA);
    saveLocal();
    showToast('Local data cleared');
    renderView();
}

// ============================================================
// UI HELPERS
// ============================================================
function openModal() {
    const modal = document.getElementById('modal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    document.body.style.overflow = 'hidden';
}
function closeModal() {
    const modal = document.getElementById('modal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
    document.body.style.overflow = '';
}
function showToast(message, isError = false) {
    const toast = document.getElementById('toast');
    const icon = document.getElementById('toast-icon');
    document.getElementById('toast-message').textContent = message;
    icon.className = isError ? 'fa-solid fa-circle-exclamation text-rose-400' : 'fa-solid fa-check-circle text-emerald-400';
    toast.classList.remove('hidden');
    setTimeout(() => toast.classList.add('hidden'), 2800);
}
function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function escapeAttr(str) {
    return escapeHtml(str).replace(/'/g, '&#39;');
}

document.getElementById('modal').addEventListener('click', (e) => {
    if (e.target.id === 'modal') closeModal();
});

// ============================================================
// INIT
// ============================================================
(async function init() {
    setSyncState(githubToken ? 'warn' : 'off');
    if (githubToken) {
        await pullFromGitHub();
    }
    showView('dashboard');
})();
</script>
</body>
</html>
